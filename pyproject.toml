# Tooling configuration for the whole repo. Deliberately has no [project]
# table: the installable package is `mcp_server/`, and this file exists so
# ruff and mypy see one configuration across the package, the scripts and the
# tests rather than three.
#
# Added because the first revision carried `# noqa: S310`, `# noqa: S603` and
# `# noqa: E402` comments for linters that were never configured or run --
# suppressions claiming a finding had been considered when nothing had looked.

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["mcp_server/src", "scripts"]
extend-exclude = [".venv", "traces", "evidence", "snippets"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "B",         # bugbear
    "S",         # bandit -- the security rules the noqa comments referenced
    "UP",        # pyupgrade
    "C4",        # comprehensions
    "SIM",       # simplify
    "PTH",       # prefer pathlib
    "RET",       # return consistency
    "ARG",       # unused arguments
    "TRY",       # exception antipatterns
]
ignore = [
    # A long-form rationale in a docstring is worth more than a wrapped line,
    # and this repo's docstrings carry the reasoning that the code cannot.
    "E501",
    # `raise ... from err` is enforced where it clarifies; TRY003's ban on long
    # messages in raise sites fights the guard rejections, whose whole value is
    # telling the operator exactly what was refused and why.
    "TRY003",
    # The tool modules deliberately catch broad families and map them to
    # BLOCKED. That is the contract, not an antipattern.
    "TRY300",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on private helpers by design -- the walk, the loader and the
# screen are where the defects were, so they are tested directly.
#
# S105/S106/S107 (hardcoded credentials) are off in tests because the secret
# scanner's tests must contain strings shaped exactly like credentials; that is
# the whole test. They are *not* off anywhere else, and `.gitleaks.toml`
# allowlists these same files by path so the two tools agree on which vectors
# are deliberate.
"**/tests/**" = ["S101", "SLF001", "ARG001", "S105", "S106", "S107", "S603", "S607"]
"tests/**" = ["S101", "SLF001", "ARG001", "S105", "S106", "S107"]
# The selfcheck CLI prints to stdout on purpose; it is not the server.
"**/__main__.py" = ["T201"]

[tool.mypy]
python_version = "3.10"
files = ["mcp_server/src", "scripts"]
# Not `strict`, and the gap is small enough to state exactly: `mypy --strict`
# reports 3 errors, all defensible --
#   2x untyped-decorator  the MCP SDK's `@server.tool()` carries no stubs
#   1x no-any-return      `json.loads` is Any by definition
# None are in this repo's own logic. The tool modules return `dict[str, Any]`
# envelopes on purpose: the MCP wire format is JSON, and inventing a TypedDict
# per verdict shape would be typing theatre over a contract whose stability is
# already enforced by tests. Re-check that count when raising the SDK ceiling.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
show_error_codes = true

# No `[[tool.mypy.overrides]]` for `mcp.*`. There was one, and it emitted
# "unused section" on every run: `server._load_server_class` resolves the SDK
# through `importlib` string names, so mypy never sees an `mcp` import to
# silence. A permanent warning that trains people to ignore warnings is worse
# than the missing-stub error it was pre-empting. Restore it the day something
# imports the SDK statically.

[tool.coverage.run]
source = ["mcp_server/src", "scripts"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = true
# A floor, not a target. Set below the current 91% so a legitimate refactor is
# not blocked by a percentage point, and high enough that deleting a test file
# fails the build. Coverage measures which lines ran, never whether the
# assertion was worth making -- the contract tests are what do that.
fail_under = 90
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
