[project]
name = "foundry-spike-mcp"
version = "0.1.0"
description = "Read-only MCP tools over planlint and the eval-harness sink (Foundry Toolkit week-1 spike)"
requires-python = ">=3.10"
dependencies = [
    # Upper bound is deliberate. An unpinned `mcp>=1.2.0` floated to 2.x, where
    # FastMCP was renamed MCPServer, and the server stopped importing on any
    # fresh install. `server._load_server_class` now accepts either major, so
    # the floor stays at 1.2 for environments the Toolkit already set up; the
    # ceiling stays because the next rename should fail a test, not a session.
    "mcp>=1.2,<3",
]

[project.optional-dependencies]
# The tool contract is tested without the MCP SDK on purpose: `planlint` and
# `scoring` import nothing from it, so a transport change cannot alter a verdict.
#
# Everything `make validate` runs belongs here. It previously held pytest
# alone, so `make setup && make validate` was red on a fresh clone at the first
# of three steps -- CI installs the linters separately and never noticed. The
# floor for a contributor and the floor for CI should be the same floor.
dev = [
    "pytest>=8.0",
    "coverage>=7.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
foundry-spike-mcp = "foundry_spike_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry_spike_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
