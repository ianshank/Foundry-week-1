[pytest]
# One invocation from the repo root covers the MCP tool contract and the
# probe screen. `cd mcp && pytest` still works on its own via that package's
# pyproject, for the tighter loop while editing the server.
testpaths = mcp_server/tests tests
pythonpath = mcp_server/src scripts .
addopts = -q
markers =
    regression: Guard test for a previously fixed defect; failure means a fix was reverted.
    aqa: Acceptance quality assurance test; validates the system against real or live dependencies.
