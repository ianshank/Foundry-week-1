name: contract

# The tool contract is the deliverable, so it is the thing CI protects.
#
# Two jobs on purpose. `contract` proves the verdict logic with nothing
# installed -- no network, no planlint, no MCP SDK -- because the tool modules
# import nothing from the transport. `transport` then installs the SDK and
# starts the actual server.
#
# The split exists because the first version had only the first job, and a
# green run certified a server that could not import: `mcp>=1.2.0` floated to
# 2.x, where FastMCP was renamed MCPServer. REQUIRE_MCP turns the smoke test's
# local skip into a hard failure here, so the gap cannot reopen quietly.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in mcp/pyproject.toml; if the suite only
        # passes on the newest interpreter, the floor is wrong.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest only
        run: python -m pip install --upgrade pip pytest

      - name: Tool contract (no third-party dependency installed)
        run: python -m pytest

      - name: Secret pass over evidence and traces
        run: python scripts/scan_evidence.py

      - name: Shell scripts parse
        run: bash -n scripts/00-baseline.sh

  transport:
    # Does the thing Agent Builder connects to actually start?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the server with its pinned SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./mcp[dev]"

      - name: Server builds and registers both tools
        env:
          REQUIRE_MCP: "1"   # a skip here would recreate the blind spot
        run: python -m pytest mcp/tests/test_server_smoke.py -v
