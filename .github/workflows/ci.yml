name: contract

# Four jobs, each proving a different claim. They are separate on purpose: the
# first revision had only `contract`, and a green tick there certified a server
# that could not import -- because the contract suite passes precisely *because*
# it avoids the SDK. One tick cannot stand in for two facts.
#
#   contract   the verdict logic is correct, with nothing installed
#   transport  the thing Agent Builder connects to actually starts
#   quality    ruff and mypy agree, so the noqa comments mean something
#   secrets    nothing credential-shaped is in the history

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: contract (no dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in mcp_server/pyproject.toml. If the suite
        # only passes on the newest interpreter, the floor is a lie.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest only
        run: python -m pip install --upgrade pip pytest

      - name: Tool contract
        run: python -m pytest -q

      - name: Shell scripts parse
        # Discovered, not listed. The three paths were hard-coded here, in the
        # Makefile and in the pre-commit hook, so a fourth script would have
        # been checked by none of them. `make shellcheck` runs the same set.
        run: |
          set -euo pipefail
          mapfile -t scripts < <(
            { git ls-files 'scripts/*.sh' '.claude/hooks/*.sh' '.githooks/*'; } | sort -u
          )
          test "${#scripts[@]}" -gt 0 || { echo "no shell scripts found -- discovery is broken"; exit 1; }
          printf 'checking %d script(s)\n' "${#scripts[@]}"
          bash -n "${scripts[@]}"

  transport:
    name: transport (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the declared range `mcp>=1.2,<3`. The floor leg exists
        # because the smoke suite used to resolve a 2.x-only module path at
        # import time: on 1.2 it errored during collection under REQUIRE_MCP
        # and skipped silently without it, so the floor was advertised and
        # never once exercised. A supported version is one CI runs.
        include:
          - sdk: resolved
            pin: ""
          - sdk: floor mcp 1.2
            pin: "mcp==1.2.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the server with its pinned SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./mcp_server[dev]"

      - name: Pin the SDK to the declared floor
        if: matrix.pin != ''
        run: python -m pip install "${{ matrix.pin }}"

      - name: Report which SDK major is under test
        run: python -c "import mcp; print(getattr(mcp, '__version__', 'unknown'), mcp.__file__)"

      - name: The suite, with the SDK required
        env:
          REQUIRE_MCP: "1"   # a skip here would recreate the blind spot
        # The whole suite, not just the smoke file. The Dockerfile's transport
        # stage already ran everything, so the two definitions of "regression"
        # disagreed; this is the stricter of the two.
        run: python -m pytest -q

  quality:
    name: quality (lint + types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters and the server
        # The SDK is installed here on purpose. Without it `test_server_smoke`
        # and `test_server_e2e_stdio` skip, `server.py` measures 0%, and the
        # floor is computed over a codebase with a hole in exactly the file
        # whose failure mode has already shipped once -- a server that could
        # not import, under a green tick. A gate that cannot see the thing it
        # is guarding is decoration.
        run: |
          python -m pip install --upgrade pip ruff mypy coverage pytest
          python -m pip install -e "./mcp_server[dev]"

      - name: ruff
        run: ruff check --output-format=github .

      - name: mypy
        run: mypy

      - name: Coverage floor
        # Measured here rather than in `contract`, whose whole value is running
        # with nothing installed.
        #
        # The floor is 90 against a real 95. Deliberately not 95: a floor set
        # to the current number is a target, and the way people hit a target is
        # by writing tests shaped like coverage rather than tests shaped like
        # the contract. Five points is room to refactor without room to delete
        # a test file unnoticed.
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, so a shallow clone would only ever see the
          # tip and miss a credential added and removed in an earlier commit.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture directories are clean
        run: python scripts/scan_evidence.py

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
