name: contract

# The tool contract is the deliverable, so it is the thing CI protects.
# No network, no planlint, no MCP SDK: the suite drives a fake binary and the
# tool modules import nothing from the transport. A green run here means the
# three-way verdict and the three-valued scorer still hold.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in mcp/pyproject.toml; if the suite only
        # passes on the newest interpreter, the floor is wrong.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Tool contract
        run: python -m pytest

      - name: Secret pass over evidence and traces
        run: python scripts/scan_evidence.py

      - name: Shell scripts parse
        run: bash -n scripts/00-baseline.sh
